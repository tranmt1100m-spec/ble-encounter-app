name: ble_encounter
description: BLEすれ違い検知アプリ
publish_to: 'none'
version: 1.7.10+43

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1

  # BLE スキャン
  flutter_blue_plus: ^1.32.12

  # ローカル保存
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # CSV エクスポート共有
  share_plus: ^9.0.0

  # データインポート（ファイル選択）
  file_picker: ^8.0.0+1

  # パーミッション要求
  permission_handler: ^11.3.1

  # 一時 ID 生成
  uuid: ^4.4.2

  # サーバー連携（自前APIサーバー）
  http: ^1.2.2

  # トークンのセキュア保存
  flutter_secure_storage: ^9.2.4

  # URL タップ対応
  url_launcher: ^6.3.0

  # バージョン表示
  package_info_plus: ^8.1.0

  # 通知スケジュール
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# アプリアイコン生成（flutter pub run flutter_launcher_icons）
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/tab_today.png"
  adaptive_icon_background: "#FBF3E4"
  adaptive_icon_foreground: "assets/icons/tab_today.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/gate/
